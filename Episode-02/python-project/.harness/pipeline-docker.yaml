# ============================================
# PIPELINE: Python App - Harness Cloud + Push to Docker Hub
# ============================================
# CHANGE THESE 4 VALUES:
#   1. projectIdentifier → Your project ID (from URL)
#   2. orgIdentifier → Your org name (usually "default")
#   3. connectorRef (codebase) → Your GitHub connector
#   4. connectorRef (docker) → Your Docker Hub connector
#
# PREREQUISITES:
#   - Harness Cloud enabled (credit card verification, no charge)
#   - Docker Hub connector created in Harness (account.dockerhub)
#   - Secret "docker-hub-password" in Harness (use a Docker Hub Personal Access Token if 2FA is enabled)
#   - Variable "docker_username" in Harness
# ============================================
pipeline:
  name: python-docker-pipeline
  identifier: python_docker_pipeline
  description: Builds and tests a Python app, pushes the image to Docker Hub, then cleans up the Docker Hub repository.
  ##################################################
  # CHANGE THIS: Your project ID
  ###################################################
  projectIdentifier: HarnessCICDZerotoHero
  ####################################################
  # CHANGE THIS: Your org name
  ###################################################
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        ##############################################
        # CHANGE THIS: Your GitHub connector
        ############################################
        connectorRef: account.Github
        ###############################################
        # CHANGE THIS: Your repo name
        ###############################################
        repoName: Harness-CI-CD-Zero-to-Hero
        build: <+input>
  stages:
    - stage:
        name: build-python
        identifier: build_python
        description: "Build, test, and push to Docker Hub"
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              # Step 1: Install dependencies
              - step:
                  type: Run
                  name: Install Dependencies
                  identifier: install_deps
                  spec:
                    shell: Sh
                    command: |-
                      echo "=== Step 1: Installing Dependencies ==="
                      cd Episode-02/python-project
                      pip install -r requirements.txt
                      echo "=== Dependencies Installed! ==="

              # Step 2: Run unit tests
              - step:
                  type: Run
                  name: Run Tests
                  identifier: run_tests
                  spec:
                    shell: Sh
                    command: |-
                      echo "=== Step 2: Running Unit Tests ==="
                      cd Episode-02/python-project
                      pip install -r requirements.txt
                      pytest test_app.py -v
                      echo "=== All 3 Tests Passed! ==="

              # Step 3: Run app and verify
              - step:
                  type: Run
                  name: Run App
                  identifier: run_app
                  spec:
                    shell: Sh
                    command: |-
                      echo "=== Step 3: Verifying App Works ==="
                      cd Episode-02/python-project
                      pip install -r requirements.txt
                      python -c "from app import app; client = app.test_client(); r = client.get('/'); print(r.get_json()); r = client.get('/health'); print(r.get_json()); print('=== App Verified! ===')"

              # Step 4: Build Docker image and Push to Docker Hub
              # Uses Harness built-in step (no privileged mode needed)
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build and Push to Docker Hub
                  identifier: build_push_docker
                  spec:
                    ###############################################
                    # CHANGE THIS: Your Docker Hub connector name
                    ##############################################
                    connectorRef: dockerhub
                    repo: <+variable.docker_username>/python-harness-app
                    tags:
                      - <+pipeline.sequenceId>
                      - latest
                    dockerfile: Episode-02/python-project/Dockerfile
                    context: Episode-02/python-project

              # Step 5: Verify success
              - step:
                  type: Run
                  name: Verify Push
                  identifier: verify_push
                  spec:
                    shell: Sh
                    command: |-
                      echo "========================================="
                      echo "  Step 5: Image Pushed Successfully!"
                      echo ""
                      echo "  Image: <+variable.docker_username>/python-harness-app:<+pipeline.sequenceId>"
                      echo "  Image: <+variable.docker_username>/python-harness-app:latest"
                      echo ""
                      echo "  View: https://hub.docker.com/r/<+variable.docker_username>/python-harness-app"
                      echo "========================================="

              # Step 6: Wait 1 minute before cleanup
              - step:
                  type: Run
                  name: Wait Before Cleanup
                  identifier: wait_before_cleanup
                  spec:
                    shell: Sh
                    command: |-
                      echo "=== Step 6: Waiting 1 minute ==="
                      echo "Giving Docker Hub time to process the push..."
                      sleep 60
                      echo "=== Done waiting! Proceeding to cleanup ==="

              # Step 7: Delete Docker Hub repository image and verify
              - step:
                  type: Run
                  name: Delete and Verify
                  identifier: delete_and_verify
                  spec:
                    shell: Sh
                    envVariables:
                      DH_USER: <+variable.docker_username>
                      DH_PASS: <+secrets.getValue("docker-hub-password")>
                    command: |-
                      echo "=== Step 7: Deleting Docker Hub Repository ==="
                      echo ""
                      REPO="$DH_USER/python-harness-app"

                      json_field() {
                        python3 -c "import sys,json
                      try:
                          print(json.load(sys.stdin).get('$1',''))
                      except Exception:
                          print('')"
                      }

                      # Attempt 1: legacy password login
                      LOGIN_BODY=$(python3 -c "import os,json; print(json.dumps({'username':os.environ['DH_USER'],'password':os.environ['DH_PASS']}))")
                      RESP=$(curl -s -X POST -H "Content-Type: application/json" -d "$LOGIN_BODY" https://hub.docker.com/v2/users/login/ || true)
                      TOKEN=$(echo "$RESP" | json_field token)
                      AUTH="JWT $TOKEN"

                      # Attempt 2: access-token endpoint (works with Personal Access Tokens / 2FA accounts)
                      if [ -z "$TOKEN" ]; then
                        echo "Legacy login returned no token: $(echo "$RESP" | head -c 300)"
                        echo "Retrying with /v2/auth/token..."
                        PAT_BODY=$(python3 -c "import os,json; print(json.dumps({'identifier':os.environ['DH_USER'],'secret':os.environ['DH_PASS']}))")
                        RESP=$(curl -s -X POST -H "Content-Type: application/json" -d "$PAT_BODY" https://hub.docker.com/v2/auth/token || true)
                        TOKEN=$(echo "$RESP" | json_field access_token)
                        AUTH="Bearer $TOKEN"
                      fi

                      if [ -z "$TOKEN" ]; then
                        echo "ERROR: Docker Hub login failed. Check the docker-hub-password secret (use a Personal Access Token if 2FA is enabled)."
                        echo "Response: $(echo "$RESP" | head -c 300)"
                        exit 1
                      fi
                      echo "Logged in to Docker Hub API"
                      echo ""

                      echo "Deleting entire repository: $REPO"
                      HTTP_CODE=$(curl -s -o /tmp/dh_delete_response.txt -w "%{http_code}" -X DELETE -H "Authorization: $AUTH" "https://hub.docker.com/v2/repositories/$REPO/")
                      if [ "$HTTP_CODE" = "202" ] || [ "$HTTP_CODE" = "204" ]; then
                        echo "=== Repository Deleted! (HTTP $HTTP_CODE) ==="
                        echo "Next run will create it fresh again."
                      else
                        echo "ERROR: Repository delete failed (HTTP $HTTP_CODE)"
                        head -c 300 /tmp/dh_delete_response.txt
                        exit 1
                      fi

              # Step 8: Final verification - confirm images are gone from Docker Hub
              - step:
                  type: Run
                  name: Final Verify
                  identifier: final_verify
                  spec:
                    shell: Sh
                    command: |-
                      echo "=== Step 8: Final Verification ==="
                      echo ""
                      echo "Checking if repository still exists on Docker Hub..."
                      echo ""
                      STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://hub.docker.com/v2/repositories/<+variable.docker_username>/python-harness-app/)
                      if [ "$STATUS" = "404" ]; then
                        echo "✅ Repository python-harness-app — DELETED (not found)"
                      else
                        echo "⚠️ Repository may still exist (status: $STATUS)"
                      fi
                      echo ""
                      echo "========================================="
                      echo "  ALL DONE!"
                      echo "  Step 1: Dependencies installed ✅"
                      echo "  Step 2: Tests passed ✅"
                      echo "  Step 3: App verified ✅"
                      echo "  Step 4: Image pushed to Docker Hub ✅"
                      echo "  Step 5: Push verified ✅"
                      echo "  Step 6: Waited 1 minute ✅"
                      echo "  Step 7: Image deleted from Docker Hub ✅"
                      echo "  Step 8: Deletion verified ✅"
                      echo "========================================="
